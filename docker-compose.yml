services:
  db:
    image: postgres:15-alpine
    container_name: lore_lens_db
    environment:
      POSTGRES_USER: lore_lens_user
      POSTGRES_PASSWORD: lore_lens_password
      POSTGRES_DB: lore_lens_db
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
  
  backend:
    container_name: lore_lens_backend
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    environment:
      DATABASE_URL: postgresql+psycopg://lore_lens_user:lore_lens_password@db:5432/lore_lens_db
      JWT_SECRET_KEY: dev-secret-change-me
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      ENVIRONMENT: local
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    depends_on:
      - db
  
  frontend:
    container_name: lore_lens_frontend
    build: ./frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
  
volumes:
  db_data:
    driver: local